[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-adk-interop"
version = "0.1.0"
description = "Google ADK counterparts of the Camunda A2A blueprint client and server agents"
requires-python = ">=3.10"
dependencies = ["google-adk[a2a]>=2.13", "a2a-sdk>=1.3", "httpx", "uvicorn"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["client_agent", "server_agent"]
